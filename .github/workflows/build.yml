name: Windows build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build
        run: dotnet build source/UsageWidget.csproj -c Release
      - name: Check usage mapping
        shell: pwsh
        run: |
          dotnet source/bin/Release/net10.0-windows/AIUsageWidget.dll --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Content source/bin/Release/net10.0-windows/checks.txt
