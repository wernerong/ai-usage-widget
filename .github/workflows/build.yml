name: Desktop builds
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: macos-15-intel
            rid: osx-x64
          - os: macos-15
            rid: osx-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore pinned dependencies
        run: dotnet restore tests/UsageWidget.UiChecks.csproj --locked-mode
      - name: Verify release tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = ([xml](Get-Content source/UsageWidget.csproj)).Project.PropertyGroup.Version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag and project version differ.' }
      - name: Build
        run: dotnet build source/UsageWidget.csproj -c Release --no-restore
      - name: Verify Grok Bot macOS application name
        if: matrix.rid == 'osx-arm64'
        shell: bash
        run: |
          stage=$(mktemp -d)
          trap 'hdiutil detach "$stage/mount" >/dev/null 2>&1 || true' EXIT
          curl --fail --location --retry 2 'https://downloads.cursor.com/grokbot/stable/darwin-arm64/0.61.0/Grok_Bot_0.61.0.dmg' -o "$stage/grok.dmg"
          hdiutil attach -readonly -nobrowse -mountpoint "$stage/mount" "$stage/grok.dmg"
          name=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleName' "$stage/mount/Grok Bot.app/Contents/Info.plist")
          test "$name" = 'Grok Bot'
      - name: Check provider parsing and refresh behavior
        shell: pwsh
        run: |
          dotnet source/bin/Release/net10.0/AIUsageWidget.dll --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Content source/bin/Release/net10.0/checks.txt
      - name: Check UI interactions and rendering
        run: dotnet run --project tests/UsageWidget.UiChecks.csproj -c Release --no-restore
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (!(Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          ./scripts/build-windows.ps1
      - name: Check Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/check-windows-installer.ps1
      - name: Package macOS
        if: runner.os == 'macOS'
        run: bash scripts/build-macos.sh ${{ matrix.rid }}
      - name: Check macOS installer
        if: runner.os == 'macOS'
        run: |
          package=$(find dist -name '*.pkg' -maxdepth 1 | head -1)
          installer -pkg "$package" -target CurrentUserHomeDirectory
          executable="$HOME/Applications/AI Usage Widget.app/Contents/MacOS/AIUsageWidget"
          test -x "$executable"
          "$executable" --version
          "$executable" --self-test
          "$executable" --verify-update-install
          installer -pkg "$package" -target CurrentUserHomeDirectory
          codesign --verify --deep --strict "$HOME/Applications/AI Usage Widget.app"
      - name: Check automatic upgrade and restart
        shell: pwsh
        run: ./scripts/check-automatic-update.ps1 -Runtime '${{ matrix.rid }}'
      - uses: actions/upload-artifact@v4
        with:
          name: AIUsageWidget-${{ matrix.rid }}
          path: |
            dist/*.exe
            dist/*.pkg
            dist/*.nupkg
            dist/releases.*.json
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: AIUsageWidget-*
          path: installers
          merge-multiple: true
      - name: Publish installers
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          cd installers
          test "$(find . -maxdepth 1 -name '*.exe' | wc -l)" -eq 1
          test "$(find . -maxdepth 1 -name '*.pkg' | wc -l)" -eq 2
          test "$(find . -maxdepth 1 -name 'releases.*.json' | wc -l)" -eq 3
          test "$(find . -maxdepth 1 -name '*-full.nupkg' | wc -l)" -eq 3
          sha256sum *.exe *.pkg *.nupkg releases.*.json > SHA256SUMS.txt
          cat > /tmp/release-notes.md <<'NOTES'
          Download the installer for your computer:
          - Windows x64: `windows-x64-setup.exe`
          - Mac Apple Silicon: `osx-arm64.pkg`
          - Mac Intel: `osx-x64.pkg`

          Install this version once to enable automatic updates. The widget checks stable GitHub Releases in the background, downloads the correct platform package, verifies it, and restarts briefly to apply it. Future releases require no manual reinstall. Preferences and provider logins are preserved. Updates can be paused in the widget menu. Quit the old widget before this one-time upgrade.

          These installers are unsigned; macOS packages are not notarized. Windows SmartScreen/macOS Gatekeeper may require additional confirmation. On Mac, sign in to Grok Bot, enable it in Subscriptions, and allow Grok Bot Safe Storage access if Keychain asks.
          NOTES
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --title "AI Usage Widget $GITHUB_REF_NAME" --notes-file /tmp/release-notes.md --draft
          fi
          gh release upload "$GITHUB_REF_NAME" *.exe *.pkg *.nupkg releases.*.json SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
